services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: onedrop
      POSTGRES_USER: onedrop
      POSTGRES_PASSWORD: onedrop
    ports: ["5432:5432"]
    volumes: [onedrop-postgres:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  onedrop-postgres:
